<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Installation Task</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #1a1a2e, #0f0f1a 80%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #ffffff;
    }
    .card {
      background: rgba(26, 26, 46, 0.95);
      border: 1px solid #ff7b00;
      box-shadow: 0 0 25px rgba(255, 123, 0, 0.25);
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      padding: 24px 20px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: rgba(255, 123, 0, 0.15);
      color: #ff9d00;
      border: 1px solid #ff7b00;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 13px;
      color: #b0b3c6;
      margin-bottom: 16px;
    }
    .video-box {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid #ff7b00;
      background: #000;
    }
    .video-box video {
      width: 100%;
      max-height: 230px;
      display: block;
    }
    .steps-box {
      background: #141423;
      border: 1px solid #2a2a42;
      border-radius: 10px;
      padding: 12px 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .steps-box ol {
      padding-left: 18px;
      font-size: 13px;
      color: #d1d5db;
      line-height: 1.6;
    }
    .steps-box ol li strong {
      color: #00ffaa;
    }
    .btn-install {
      display: block;
      width: 100%;
      padding: 14px;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #00b09b, #96c93d);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 176, 155, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(0, 176, 155, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 176, 155, 0); }
    }
    .footer-note {
      margin-top: 14px;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">TASK REQUIRED</div>
    <h1>Complete Installation to Unlock</h1>
    <p class="subtitle">Niche diye gaye video ko dekhein aur app install karein.</p>

    <!-- Video Box (Autoplay OFF, direct controls) -->
    <div class="video-box">
      <video controls playsinline preload="metadata">
        <source src="tutorial.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <div class="steps-box">
      <ol>
        <li>Niche <strong>INSTALL NOW</strong> par click karein.</li>
        <li>App download karke install karein.</li>
        <li>App ko open karke 30 seconds wait karein.</li>
      </ol>
    </div>

    <!-- Aapka CPA link -->
    <a href="https://www.cdnflair.com/view.php?id=5546832&pub=3361737" class="btn-install" target="_blank">
      INSTALL NOW
    </a>

    <div class="footer-note">
      100% Secure &amp; Verified Task
    </div>
  </div>

</body>
</html>
